# ProofSprint alert rules. Each rule maps to a user-facing symptom, with a runbook hint.
groups:
  - name: proofsprint-availability
    rules:
      - alert: ProofSprintDown
        expr: up{job=~"proofsprint-.*"} == 0
        for: 15s
        labels:
          severity: critical
          team: proofsprint
        annotations:
          summary: "ProofSprint {{ $labels.env }} is down"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} for 15s. Check: pm2 logs proofsprint-{{ $labels.env }}"

      - alert: ProofSprintHighErrorRate
        expr: |
          sum by (env) (rate(http_requests_total{job=~"proofsprint-.*", status=~"5.."}[30s]))
            / clamp_min(sum by (env) (rate(http_requests_total{job=~"proofsprint-.*"}[30s])), 0.001) > 0.05
        for: 10s
        labels:
          severity: critical
          team: proofsprint
        annotations:
          summary: "High 5xx error rate on ProofSprint {{ $labels.env }}"
          description: "{{ $value | humanizePercentage }} of requests are failing (threshold 5% over 30s). Founders cannot create sprints or record interviews."

  - name: proofsprint-performance
    rules:
      - alert: ProofSprintHighLatencyP95
        expr: histogram_quantile(0.95, sum by (le, env) (rate(http_request_duration_seconds_bucket{job=~"proofsprint-.*"}[1m]))) > 0.5
        for: 30s
        labels:
          severity: warning
          team: proofsprint
        annotations:
          summary: "Slow responses on ProofSprint {{ $labels.env }}"
          description: "95th percentile latency is {{ $value | humanizeDuration }} (threshold 500ms)."

      - alert: ProofSprintHighMemory
        expr: process_resident_memory_bytes{job=~"proofsprint-.*"} > 250 * 1024 * 1024
        for: 1m
        labels:
          severity: warning
          team: proofsprint
        annotations:
          summary: "ProofSprint {{ $labels.env }} memory is high"
          description: "Resident memory is {{ $value | humanize1024 }}B (PM2 restarts the process at 300MB)."

      - alert: ProofSprintEventLoopLag
        expr: nodejs_eventloop_lag_p99_seconds{job=~"proofsprint-.*"} > 0.2
        for: 30s
        labels:
          severity: warning
          team: proofsprint
        annotations:
          summary: "Node.js event loop is blocked on ProofSprint {{ $labels.env }}"
          description: "p99 event-loop lag is {{ $value }}s; requests are queuing."

  - name: monitoring-health
    rules:
      - alert: AlertNotifierDown
        expr: up{job="alert-notifier"} == 0
        for: 30s
        labels:
          severity: warning
          team: proofsprint
        annotations:
          summary: "The alert notifier is down"
          description: "Alerts are still visible in Alertmanager but the team is not being notified."
