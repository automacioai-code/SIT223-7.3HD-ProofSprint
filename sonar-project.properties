# SonarQube Cloud (sonarcloud.io) configuration - Code Quality stage
sonar.organization=automacioai-code
sonar.projectKey=automacioai-code_SIT223-7.3HD-ProofSprint
sonar.projectName=ProofSprint (SIT223 7.3HD)
sonar.host.url=https://sonarcloud.io

sonar.sources=src,public,ci/scripts,monitoring/alert-notifier
sonar.tests=tests
sonar.exclusions=**/node_modules/**,coverage/**,reports/**,dist/**
# Coverage is measured on the application code; pipeline scripts are verified by running them.
sonar.coverage.exclusions=public/**,ci/**,monitoring/**,src/server.js
sonar.cpd.exclusions=tests/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Import our custom ESLint rules (complexity, size limits, security plugin) as external issues.
sonar.eslint.reportPaths=reports/eslint.json
sonar.sourceEncoding=UTF-8

# Gated check: the scanner waits for the quality gate and fails the stage if it is red.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
