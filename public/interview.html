<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProofSprint · Interview</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="chat-page">
  <header class="top"><div class="brand"><span class="mark">PS</span> ProofSprint interview</div></header>
  <main>
    <section class="card" id="intro">
      <h1 id="title">Loading…</h1>
      <p id="consent" class="small"></p>
      <form id="startForm" class="stack">
        <label for="alias" class="sr-only">First name or nickname</label>
        <input id="alias" name="alias" placeholder="First name or nickname (optional)" maxlength="40">
        <label class="small" for="consentBox"><input id="consentBox" type="checkbox" name="consent" required> I agree to take part</label>
        <button type="submit">Start the chat</button>
      </form>
      <p id="msg" class="msg"></p>
    </section>
    <section class="card hidden" id="chat">
      <div id="log" class="log"></div>
      <form id="answerForm" class="row">
        <label for="answer" class="sr-only">Your answer</label>
        <input id="answer" name="text" placeholder="Type your answer…" autocomplete="off" required>
        <button type="submit">Send</button>
      </form>
    </section>
  </main>
  <script src="/interview.js"></script>
</body>
</html>
